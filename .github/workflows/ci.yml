name: ci

on:
  push:
    branches: [main]
  pull_request:

# Downloading job logs needs admin rights, annotations are public. Each test
# job therefore ends with a step that copies the failures of go test into one
# annotation (open the run summary, or GET /check-runs/<id>/annotations).

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The end-to-end tests drive real shells and git filter-repo; tests skip
      # themselves when a tool is missing, so install everything to run them all.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash-completion zsh fish git-filter-repo make zip openssh-client
      - run: make fmt-check vet
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test.log
      - name: Report failures as an annotation
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -B2 -A12 -- '--- FAIL|^FAIL|panic:' test.log | head -150 || true)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=go test failures (${{ runner.os }})::${msg}"

  # Run the tests on macOS and Windows too. The tests were written on Linux:
  # tools that are not there (fish, bash-completion, git-filter-repo) make the
  # tests that need them skip, and on Windows the end-to-end tests skip as they
  # need POSIX shells. The Windows job does not fail the workflow yet, so the
  # first runs can show what is left; drop continue-on-error once it is green.
  test-other-os:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test.log
      - name: Report failures as an annotation
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -B2 -A12 -- '--- FAIL|^FAIL|panic:' test.log | head -150 || true)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=go test failures (${{ runner.os }})::${msg}"

  # Compile every release target, so a platform-specific break shows up in a
  # pull request and not only when a release is cut.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o /dev/null ./cmd/git-id
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
